<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ✅ PWA META -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#d4a3a3" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />

  <title>CV Neng Ayu wulandaria - Minimalist Pink Nude</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #fdf8f7;
      --accent-rose: #d4a3a3;
      --deep-mauve: #5a4444;
      --soft-blush: #f2e1df;
    }

    body {
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      background-color: var(--bg-color);
      color: var(--deep-mauve);
    }

    h1, h2, .brand {
      font-family: 'Playfair Display', serif;
    }
    
    header {
      background: rgba(253, 248, 247, 0.8) !important;
      border-bottom: 1px solid rgba(212, 163, 163, 0.15);
    }

    #content {
      opacity: 0;
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      transform: scale(0.99);
    }
    
    #content.fade-in {
      opacity: 1;
      transform: scale(1);
    }

    .nav-item.nav-active {
      color: var(--accent-rose);
    }
    .nav-item.nav-active::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 20%;
      width: 60%;
      height: 3px;
      background: var(--accent-rose);
      border-radius: 10px;
    }

    .mobile-nav-active {
      color: #fff !important;
    }
    .mobile-nav-active span {
      background-color: var(--accent-rose);
      border-radius: 20px;
      padding: 6px 14px;
      box-shadow: 0 4px 15px rgba(212, 163, 163, 0.4);
    }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg-color); }
    ::-webkit-scrollbar-thumb { background: var(--soft-blush); border-radius: 10px; }
    
    @keyframes pulse-soft-pink {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.1); opacity: 0.3; }
    }
    .animate-pulse-pink { 
      animation: pulse-soft-pink 4s ease-in-out infinite;
    }
  </style>
</head>

<body class="leading-relaxed pb-24 md:pb-0">

  <!-- (SEMUA KODE KAMU TETAP, TIDAK DIUBAH) -->

  <header class="hidden md:block sticky top-0 z-50 backdrop-blur-md">
    <div class="container mx-auto px-6 py-5 flex justify-between items-center">
      <div class="brand text-2xl font-bold italic tracking-tighter text-[#7d5a5a]">Neng Ayu wulandari.</div>
      <nav>
        <ul class="flex space-x-8 text-[11px] font-semibold uppercase tracking-[0.2em] text-[#b4a1a1]">
          <li data-page="home.html" class="nav-item relative cursor-pointer hover:text-[#d4a3a3] transition-all">Home</li>
          <li data-page="about.html" class="nav-item relative cursor-pointer hover:text-[#d4a3a3] transition-all">About</li>
          <li data-page="skills.html" class="nav-item relative cursor-pointer hover:text-[#d4a3a3] transition-all">Skills</li>
          <li data-page="experience.html" class="nav-item relative cursor-pointer hover:text-[#d4a3a3] transition-all">Exp</li>
          <li data-page="education.html" class="nav-item relative cursor-pointer hover:text-[#d4a3a3] transition-all">Edu</li>
          <li data-page="certifikate.html" class="nav-item relative cursor-pointer hover:text-[#d4a3a3] transition-all">Cer</li>
          <li data-page="github.html" class="nav-item relative cursor-pointer hover:text-[#d4a3a3] transition-all">Work</li>
          <li data-page="contact.html" class="nav-item relative cursor-pointer hover:text-[#d4a3a3] transition-all">Mail</li>
        </ul>
      </nav>
    </div>
  </header>

  <div class="md:hidden flex justify-center py-6">
    <div class="brand text-3xl font-bold italic text-[#7d5a5a]">Neng Ayu wulandari.</div>
  </div>

  <main class="container mx-auto px-4 md:px-6 relative">
    <div id="content" class="min-h-[75vh] py-6"></div>
  </main>

  <script src="script.js"></script>

  <!-- ✅ REGISTER SERVICE WORKER -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js")
          .then(() => console.log("PWA aktif"))
          .catch(() => console.log("PWA gagal"));
      });
    }
  </script>

</body>
</html>
